name: Build Native Libraries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CURL_VERSION: "8.11.1"
  MBEDTLS_VERSION: "3.6.2"

jobs:
  # =========================================================================
  # Windows x64 -> native_net.dll
  # =========================================================================
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S native_net/src -B build -A x64 -DCMAKE_BUILD_TYPE=Release -DNATIVE_NET_FORCE_BUILD=ON
          cmake --build build --config Release --parallel
      - name: Collect
        shell: bash
        run: |
          mkdir -p out
          cp build/Release/native_net.dll out/
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: out/

  # =========================================================================
  # Linux x64 -> libnative_net.so
  # =========================================================================
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S native_net/src -B build -DCMAKE_BUILD_TYPE=Release -DNATIVE_NET_FORCE_BUILD=ON
          cmake --build build --config Release --parallel
      - name: Collect
        run: |
          mkdir -p out
          cp build/libnative_net.so out/
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: out/

  # =========================================================================
  # Android all ABIs -> native_net.aar
  # =========================================================================
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d

      - name: Build all ABIs
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            echo "=== Building $ABI ==="
            cmake -S native_net/src -B build-$ABI \
              -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=$ABI \
              -DANDROID_PLATFORM=android-21 \
              -DCMAKE_BUILD_TYPE=Release \
              -DNATIVE_NET_FORCE_BUILD=ON
            cmake --build build-$ABI --config Release --parallel
          done

      - name: Package AAR
        run: |
          # AAR is a zip with specific structure
          mkdir -p aar_staging/jni/arm64-v8a aar_staging/jni/armeabi-v7a aar_staging/jni/x86_64
          cp build-arm64-v8a/libnative_net.so   aar_staging/jni/arm64-v8a/
          cp build-armeabi-v7a/libnative_net.so  aar_staging/jni/armeabi-v7a/
          cp build-x86_64/libnative_net.so       aar_staging/jni/x86_64/

          # Minimal AndroidManifest.xml
          cat > aar_staging/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.example.native_net">
          </manifest>
          EOF

          # Empty classes.jar (required by AAR spec)
          cd aar_staging && jar cf classes.jar -C /dev/null . 2>/dev/null || (mkdir empty && cd empty && jar cf ../classes.jar . && cd .. && rm -rf empty)

          # Create AAR
          cd aar_staging && zip -r ../native_net.aar . && cd ..
          ls -lh native_net.aar

      - uses: actions/upload-artifact@v4
        with:
          name: android-aar
          path: native_net.aar

  # =========================================================================
  # Apple (iOS + macOS) -> native_net.xcframework
  # =========================================================================
  build-apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build macOS arm64
        run: |
          cmake -S native_net/src -B build-macos-arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.11 \
            -DNATIVE_NET_FORCE_BUILD=ON
          cmake --build build-macos-arm64 --config Release --parallel

      - name: Build macOS x86_64
        run: |
          cmake -S native_net/src -B build-macos-x64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.11 \
            -DNATIVE_NET_FORCE_BUILD=ON
          cmake --build build-macos-x64 --config Release --parallel

      - name: Create macOS universal binary
        run: |
          mkdir -p universal-macos
          lipo -create \
            build-macos-arm64/libnative_net.dylib \
            build-macos-x64/libnative_net.dylib \
            -output universal-macos/libnative_net.dylib

      - name: Build iOS arm64
        run: |
          cmake -S native_net/src -B build-ios-arm64 \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=9.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DNATIVE_NET_FORCE_BUILD=ON
          cmake --build build-ios-arm64 --config Release --parallel

      - name: Build iOS Simulator arm64
        run: |
          cmake -S native_net/src -B build-ios-sim-arm64 \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=9.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DNATIVE_NET_FORCE_BUILD=ON
          cmake --build build-ios-sim-arm64 --config Release --parallel

      - name: Create XCFramework
        run: |
          # Find the actual library files
          echo "=== macOS universal ==="
          ls -la universal-macos/
          echo "=== iOS arm64 ==="
          find build-ios-arm64 -name "libnative_net.*" | head -5
          echo "=== iOS Simulator arm64 ==="
          find build-ios-sim-arm64 -name "libnative_net.*" | head -5

          # Prepare header directory
          mkdir -p headers
          cp native_net/src/native_net_ffi.h headers/

          # Create XCFramework
          xcodebuild -create-xcframework \
            -library universal-macos/libnative_net.dylib \
            -headers headers/ \
            -library build-ios-arm64/libnative_net.dylib \
            -headers headers/ \
            -library build-ios-sim-arm64/libnative_net.dylib \
            -headers headers/ \
            -output native_net.xcframework

          echo "=== XCFramework structure ==="
          find native_net.xcframework -type f | head -20

          # Package
          tar czf native_net-xcframework.tar.gz native_net.xcframework/

      - uses: actions/upload-artifact@v4
        with:
          name: apple-xcframework
          path: native_net-xcframework.tar.gz

  # =========================================================================
  # Package & Release
  # =========================================================================
  release:
    needs: [build-windows, build-linux, build-android, build-apple]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release

          # Android AAR (all ABIs in one file)
          cp artifacts/android-aar/native_net.aar release/

          # Apple XCFramework (iOS + macOS in one package)
          cp artifacts/apple-xcframework/native_net-xcframework.tar.gz release/

          # Windows
          cd artifacts/windows-x64 && zip -r ../../release/native_net-windows-x64.zip . && cd ../..

          # Linux
          cd artifacts/linux-x64 && tar czf ../../release/native_net-linux-x64.tar.gz . && cd ../..

          echo "=== Release assets ==="
          ls -lh release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "native_net ${{ github.ref_name || format('prebuilt-{0}', github.run_number) }}"
          tag_name: ${{ github.ref_name || format('prebuilt-{0}', github.run_number) }}
          body: |
            Prebuilt `native_net` binaries (libcurl ${{ env.CURL_VERSION }} + mbedTLS ${{ env.MBEDTLS_VERSION }}).

            | File | Platform | Contents |
            |------|----------|----------|
            | `native_net.aar` | Android | arm64-v8a + armeabi-v7a + x86_64 |
            | `native_net-xcframework.tar.gz` | iOS + macOS | arm64 (device) + arm64 (sim) + universal macOS |
            | `native_net-windows-x64.zip` | Windows | x64 DLL (Schannel) |
            | `native_net-linux-x64.tar.gz` | Linux | x64 SO (mbedTLS) |

            **Quick setup:**
            ```bash
            cd native_net && bash scripts/download_prebuilt.sh
            ```
          files: release/*
          generate_release_notes: true
