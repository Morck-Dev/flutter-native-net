name: native_net
description: "A Flutter plugin for native HTTP networking. Uses OkHttp on Android and URLSession on iOS/macOS for superior performance and platform integration."
version: 0.1.0
homepage: https://github.com/example/flutter-native-net
repository: https://github.com/example/flutter-native-net

environment:
  sdk: ^3.11.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.native_net
        pluginClass: NativeNetPlugin
      ios:
        pluginClass: NativeNetPlugin
      macos:
        pluginClass: NativeNetPlugin
