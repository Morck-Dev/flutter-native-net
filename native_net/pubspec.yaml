name: native_net
description: >
  A Flutter plugin for native HTTP networking powered by libcurl.
  Uses libcurl via dart:ffi on Android, iOS, macOS, Linux, Windows
  and falls back to the browser Fetch API on web.
version: 0.3.0
homepage: https://github.com/Morck-Dev/flutter-native-net
repository: https://github.com/Morck-Dev/flutter-native-net

environment:
  sdk: ^3.11.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.3
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/cacert.pem

  plugin:
    platforms:
      android:
        package: com.example.native_net
        pluginClass: NativeNetPlugin
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
